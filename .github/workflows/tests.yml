name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # The suite deliberately does not install the ML stack. It stubs
      # utils.audio_utils, so routes, templates, retention and plotting are
      # covered in seconds instead of downloading 4.5 GB of weights.
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
